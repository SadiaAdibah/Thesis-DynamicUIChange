<!DOCTYPE html>
<html>
<head>
    <title>Emotion Adaptive UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transition: all 0.8s ease;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            animation: slideDown 0.6s ease-out;
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
            transition: all 0.8s ease;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.8;
            transition: all 0.8s ease;
        }

        .video-section {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.8s ease;
            border: 5px solid rgba(255, 255, 255, 0.3);
        }

        .emotion-display {
            text-align: center;
            margin-top: 30px;
            animation: fadeIn 0.8s ease;
        }

        #emotionIcon {
            font-size: 4em;
            margin-bottom: 15px;
            animation: bounce 0.6s ease;
        }

        #emotionText {
            font-size: 2.5em;
            font-weight: 700;
            margin: 20px 0;
            transition: all 0.8s ease;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .emotion-description {
            font-size: 1.1em;
            margin-top: 15px;
            opacity: 0.9;
            transition: all 0.8s ease;
            min-height: 60px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.18);
            color: inherit;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #stopBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.8s ease;
            min-width: 250px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .stats p {
            margin: 10px 0;
            font-size: 1em;
            opacity: 0.9;
        }

        canvas {
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* EMOTION-SPECIFIC STYLES */

        /* Happy */
        body.happy {
            background: linear-gradient(135deg, #FFE066 0%, #FFC93C 100%);
            color: #333;
        }
        body.happy h1 { color: #FF9800; }
        body.happy #emotionText { color: #FF6B35; }
        body.happy video { border-color: #FFE066; box-shadow: 0 20px 60px rgba(255, 152, 0, 0.4); }
        body.happy .stats { background: rgba(255, 200, 0, 0.2); border-color: #FFE066; }

        /* Sad */
        body.sad {
            background: linear-gradient(135deg, #6FA8DC 0%, #4A90E2 100%);
            color: #fff;
        }
        body.sad h1 { color: #FFFFFF; }
        body.sad #emotionText { color: #E8F4F8; }
        body.sad video { border-color: #4A90E2; box-shadow: 0 20px 60px rgba(74, 144, 226, 0.4); }
        body.sad .container {
            background: rgba(74, 144, 226, 0.18);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        body.sad .emotion-display,
        body.sad .stats,
        body.sad .header {
            color: #F0F9FF;
        }
        body.sad .stats { background: rgba(74, 144, 226, 0.24); border-color: #6FA8DC; }
        body.sad button {
            background-color: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
        }

        /* Angry */
        body.angry {
            background: linear-gradient(135deg, #FF6B6B 0%, #EE5A52 100%);
            color: #fff;
        }
        body.angry h1 { color: #FFFFFF; text-shadow: 0 4px 15px rgba(238, 90, 82, 0.5); }
        body.angry #emotionText { color: #FFE5E5; font-size: 3em; }
        body.angry video { border-color: #FF6B6B; box-shadow: 0 20px 60px rgba(255, 107, 107, 0.5); }
        body.angry .stats { background: rgba(255, 107, 107, 0.2); border-color: #FF6B6B; }

        /* Fear */
        body.fear {
            background: linear-gradient(135deg, #B39DDB 0%, #9575CD 100%);
            color: #fff;
        }
        body.fear h1 { color: #F3E5F5; }
        body.fear #emotionText { color: #E1BEE7; }
        body.fear video { border-color: #B39DDB; box-shadow: 0 20px 60px rgba(179, 157, 219, 0.4); }
        body.fear .stats { background: rgba(179, 157, 219, 0.2); border-color: #B39DDB; }

        /* Surprise */
        body.surprise {
            background: linear-gradient(135deg, #FFD1DC 0%, #FF69B4 100%);
            color: #fff;
        }
        body.surprise h1 { color: #FFFFFF; }
        body.surprise #emotionText { color: #FFF5F7; font-size: 2.8em; }
        body.surprise video { border-color: #FF69B4; box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4); }
        body.surprise .stats { background: rgba(255, 105, 180, 0.2); border-color: #FFD1DC; }

        /* Disgust */
        body.disgust {
            background: linear-gradient(135deg, #8BC34A 0%, #6FAD59 100%);
            color: #fff;
        }
        body.disgust h1 { color: #FFFFFF; }
        body.disgust #emotionText { color: #E8F5E9; }
        body.disgust video { border-color: #8BC34A; box-shadow: 0 20px 60px rgba(139, 195, 74, 0.4); }
        body.disgust .stats { background: rgba(139, 195, 74, 0.2); border-color: #8BC34A; }

        /* Neutral */
        body.neutral {
            background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%);
            color: #333;
        }
        body.neutral h1 { color: #424242; }
        body.neutral #emotionText { color: #616161; }
        body.neutral video { border-color: #E0E0E0; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); }
        body.neutral .stats { background: rgba(224, 224, 224, 0.3); border-color: #E0E0E0; }

        /* No Face Detected */
        body.nofacedetected {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            color: #fff;
        }
        body.nofacedetected h1 { color: #FFFFFF; }
        body.nofacedetected #emotionText { color: #FFE0B2; }

    </style>
</head>

<body class="neutral">

<div class="container">
    <div class="header">
        <h1>🎭 Emotion Adaptive Interface</h1>
        <p class="subtitle">AI-Powered Mood Detection</p>
    </div>

    <div class="video-section">
        <video id="video" autoplay></video>
    </div>

    <canvas id="canvas"></canvas>

    <div class="emotion-display">
        <div id="emotionIcon">😐</div>
        <h2 id="emotionText">Detecting...</h2>
        <p class="emotion-description" id="emotionDesc">Initializing emotion detection...</p>
    </div>

    <div class="controls">
        <!-- Buttons removed as per user request -->
    </div>

    <div class="stats">
        <p><strong>Status:</strong> <span id="status">Ready</span></p>
        <p><strong>Frames Processed:</strong> <span id="frameCount">0</span></p>
        <p><strong>Detection Interval:</strong> 30 seconds</p>
    </div>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const emotionText = document.getElementById("emotionText");
const emotionIcon = document.getElementById("emotionIcon");
const emotionDesc = document.getElementById("emotionDesc");
const statusText = document.getElementById("status");
const frameCounter = document.getElementById("frameCount");

let isDetecting = false;
let frameCount = 0;
let detectionInterval = null;

const emotionData = {
    "Happy": {
        icon: "😊",
        desc: "You're feeling great! Keep smiling! 🌟",
        class: "happy"
    },
    "Sad": {
        icon: "😢",
        desc: "Cheer up! Things will get better. 💙",
        class: "sad"
    },
    "Angry": {
        icon: "😠",
        desc: "Take a deep breath and relax. 🧘",
        class: "angry"
    },
    "Fear": {
        icon: "😨",
        desc: "Stay calm and brave! You've got this. 💪",
        class: "fear"
    },
    "Surprise": {
        icon: "😲",
        desc: "Wow! Something amazing just happened! ✨",
        class: "surprise"
    },
    "Disgust": {
        icon: "🤢",
        desc: "Let's focus on the positive things! 🌈",
        class: "disgust"
    },
    "Neutral": {
        icon: "😐",
        desc: "Looking neutral right now. 👀",
        class: "neutral"
    },
    "No face detected": {
        icon: "🔍",
        desc: "Please position your face in front of the camera.",
        class: "nofacedetected"
    }
};

function startDetection() {
    if (isDetecting) return;

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            video.srcObject = stream;
            isDetecting = true;
            statusText.innerText = "Detecting...";
            statusText.style.color = "#4CAF50";

            detectionInterval = setInterval(sendFrame, 30000);
        })
        .catch(err => {
            alert("Camera access denied: " + err.message);
            statusText.innerText = "Camera Error";
        });
}

function stopDetection() {
    if (!isDetecting) return;

    isDetecting = false;
    clearInterval(detectionInterval);
    video.srcObject.getTracks().forEach(track => track.stop());
    statusText.innerText = "Stopped";
    statusText.style.color = "#FF9800";
    emotionText.innerText = "Detection Stopped";
    emotionIcon.innerText = "⏹";
    emotionDesc.innerText = "Click 'Start Detection' to resume.";
}

function sendFrame() {
    if (!isDetecting) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append("image", blob);

        fetch("http://127.0.0.1:5000/detect", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            frameCount++;
            frameCounter.innerText = frameCount;

            const emotion = data.emotion;
            const emotionInfo = emotionData[emotion] || emotionData["Neutral"];

            // Update emotion display
            emotionText.innerText = emotion;
            emotionIcon.innerText = emotionInfo.icon;
            emotionDesc.innerText = emotionInfo.desc;

            // Update body class for styling
            document.body.className = emotionInfo.class;

            statusText.innerText = "✓ Detected";
            statusText.style.color = "#4CAF50";
        })
        .catch(err => {
            statusText.innerText = "Connection Error";
            statusText.style.color = "#F44336";
            console.error("Error:", err);
        });
    }, "image/jpeg");
}

// Start detection on load
window.addEventListener('load', () => {
    startDetection();
});

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (isDetecting) {
        stopDetection();
    }
});

</script>

</body>
</html>
